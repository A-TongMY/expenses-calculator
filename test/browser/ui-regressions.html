<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI regression tests</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<script type="module">
import { setupSpending } from "../../spending-ui.js";
import { setupRenovation } from "../../renovation-ui.js";
import { setupHouses } from "../../houses.js";
import { setupHome } from "../../home.js";
import { currentDate, currentMonth } from "../../format.js";
import { fixture } from "../helpers/renovation-fixture.js";

const source = new DOMParser().parseFromString(await (await fetch("/index.html")).text(), "text/html");
source.querySelectorAll("script").forEach((script) => script.remove());
const markup = source.body.innerHTML;
const results = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); };
let state;
let spending;
let renovation;
let houses;
let home;
let nextId = 0;
const byId = (id) => document.getElementById(id);
const field = (name) => byId("spending-form").elements.namedItem(name);
const click = (selector) => document.querySelector(selector).click();
const inlineSpending = () => byId("spending-list").querySelector("form");
const noEntryFocus = (doc = document) =>
  !doc.activeElement.matches("input,select,textarea");

function showPage(name) {
  for (const page of ["home", "expenses", "spending", "houses", "renovation"]) {
    byId(`page-${page}`).hidden = page !== name;
  }
}

function reset(name = "spending") {
  document.body.innerHTML = markup;
  document.body.style.fontSize = "";
  byId("signed-in-shell").hidden = false;
  byId("startup-panel").hidden = true;
  showPage(name);
  state = fixture();
  state.lifestyle = [
    { id: "food", name: "Food", low: 400, high: 800, everyMonths: 1 },
    { id: "fuel", name: "Fuel", low: 200, high: 400, everyMonths: 1 },
  ];
  state.spending = [{
    id: "lunch", date: currentDate(), categoryId: "food", amount: 12.34, description: "Lunch",
  }];
  const commit = (next) => {
    state = next;
    spending.render();
    renovation.render();
    houses.render();
    home.render();
  };
  const options = { getState: () => state, commit, newId: () => `ui-${++nextId}` };
  spending = setupSpending(options);
  renovation = setupRenovation(options);
  houses = setupHouses({ ...options, notify: (message) => { throw new Error(message); } });
  home = setupHome(options);
  spending.render();
  renovation.render();
  houses.render();
  home.render();
}

async function test(name, operation) {
  try {
    reset();
    await operation();
    results.push({ name, passed: true });
  } catch (error) {
    results.push({ name, passed: false, error: error.message });
  }
}

await test("Spending date and month fields use app sizing instead of native themed boxes", () => {
  for (const control of [field("date"), byId("spending-month")]) {
    const style = getComputedStyle(control);
    assert(style.appearance === "none", `${control.type} retains browser-native themed sizing`);
    assert(style.display === "block", `${control.type} retains inline baseline spacing`);
    const rect = control.getBoundingClientRect();
    const amount = field("amount").getBoundingClientRect();
    assert(Math.abs(rect.height - amount.height) <= 1, `${control.type} height differs from Amount`);
    const container = control.parentElement.getBoundingClientRect();
    assert(Math.abs(rect.width - container.width) <= 1, `${control.type} does not fit its field`);
  }
});

await test("cancelling Spending leaves saved data and the Add draft unchanged", () => {
  field("description").value = "Add draft";

  inlineSpending().elements.namedItem("amount").value = "99";
  const confirm = window.confirm;
  window.confirm = () => true;
  try { inlineSpending().querySelector('[data-action="cancel"]').click(); }
  finally { window.confirm = confirm; }
  assert(state.spending[0].amount === 12.34, "Cancel changed saved data");
  assert(field("description").value === "Add draft", "Cancel changed the Add draft");
  assert(noEntryFocus(), "Cancel reopened an input keyboard");
});

await test("Spending inline draft survives rerender and rejected discard", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  assert(form, "Inline Spending editor is missing");
  const description = form.elements.namedItem("description");
  description.value = "Unfinished edit";
  description.focus();
  description.setSelectionRange(4, 4);
  spending.render();
  assert(inlineSpending() === form && document.activeElement === description && description.selectionStart === 4, "Rerender disrupted the inline editor");
  const confirm = window.confirm;
  window.confirm = () => false;
  try { form.querySelector('[data-action="cancel"]').click(); }
  finally { window.confirm = confirm; }
  assert(inlineSpending() === form && description.value === "Unfinished edit", "Rejected discard lost the draft");
});

await test("Spending rejects a filter change that would discard a dirty inline editor", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  form.elements.namedItem("amount").value = "77";
  const month = byId("spending-month");
  const previous = month.value;
  const confirm = window.confirm;
  window.confirm = () => false;
  try {
    month.value = "2024-02";
    month.dispatchEvent(new Event("change"));
  } finally { window.confirm = confirm; }
  assert(month.value === previous && inlineSpending() === form, "Rejected filter change lost the inline draft");
});

await test("suspending a new Renovation item preserves its staged-payment edit identity", () => {
  showPage("renovation");
  byId("renovation-add-item").click();
  const addHost = byId("renovation-editor");
  const itemForm = addHost.querySelector("form");
  itemForm.elements.namedItem("name").value = "New planned item";
  itemForm.elements.namedItem("actualCost").value = "500";
  itemForm.dispatchEvent(new Event("input", { bubbles: true }));
  const paymentForm = addHost.querySelectorAll("form")[1];
  paymentForm.elements.namedItem("amount").value = "100";
  paymentForm.requestSubmit();
  const row = addHost.querySelector(".renovation-payments li");
  [...row.querySelectorAll("button")].find((node) => node.textContent === "Edit payment").click();
  paymentForm.elements.namedItem("amount").value = "150";
  const existing = byId("renovation-list").querySelector("details");
  [...existing.querySelectorAll("button")].find((node) => node.textContent === "Edit item and payments").click();
  existing.querySelector("form").requestSubmit();
  assert(addHost.querySelector("form") === itemForm, "Suspended new item was not restored");
  paymentForm.requestSubmit();
  itemForm.requestSubmit();
  const saved = state.renovationItems.find((item) => item.name === "New planned item");
  assert(saved, "Restored new item was not saved");
  const payments = state.renovationPayments.filter((payment) => payment.itemId === saved.id);
  assert(payments.length === 1 && payments[0].amount === 150, "Restored payment edit became a new duplicate payment");
  assert(noEntryFocus(), "New renovation item save reopened an input keyboard");
});

async function expensesFrame({ stress = false, completeAccount = false } = {}) {
  const doc = source.cloneNode(true);
  doc.querySelector('meta[http-equiv="Content-Security-Policy"]').remove();
  const base = doc.createElement("base");
  base.href = `${location.origin}/`;
  doc.head.prepend(base);
  const account = fixture();
  account.commitments = [{ id: "rent", name: "Rent", amount: 1000, everyMonths: 1 }];
  if (completeAccount) {
    account.lifestyle = [{ id: "food", name: "Food", low: 400, high: 800, everyMonths: 1 }];
    account.spending = [{ id: "lunch", date: currentDate(), categoryId: "food", amount: 12.34, description: "Lunch" }];
  }
  if (stress) {
    account.commitments[0] = {
      ...account.commitments[0], name: "R".repeat(80), amount: 1000000000, scenario: { on: true },
    };
  }
  const transport = doc.createElement("script");
  transport.textContent = `
    let account = ${JSON.stringify(account)};
    window.fetch = async (path, options = {}) => {
      if (path !== "/api/state") throw new Error("Unexpected test request: " + path);
      if (options.method === "PUT") {
        account = JSON.parse(JSON.parse(options.body).backup).data;
        return Response.json({ ok: true });
      }
      return Response.json({ backup: JSON.stringify({ schemaVersion: 8, data: account }) });
    };
    location.hash = "#/expenses";
  `;
  doc.head.append(transport);
  const app = doc.createElement("script");
  app.type = "module";
  app.src = "/app.js";
  doc.body.append(app);
  const frame = document.createElement("iframe");
  frame.title = "Synthetic Expenses UI test";
  frame.style.cssText = "width:100%;height:900px;border:0";
  if (stress) frame.style.width = "320px";
  frame.srcdoc = doc.documentElement.outerHTML;
  document.body.replaceChildren(frame);
  const deadline = performance.now() + 5000;
  while (!frame.contentDocument?.querySelector('#signed-in-shell:not([hidden])')) {
    assert(performance.now() < deadline, "Synthetic Expenses app did not initialize");
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
  return frame.contentDocument;
}

await test("real-app inline edits across all modules reach the saved account snapshot", async () => {
  const doc = await expensesFrame({ completeAccount: true });
  const go = async (name) => {
    doc.defaultView.location.hash = `#/${name}`;
    const deadline = performance.now() + 5000;
    while (doc.getElementById(`page-${name}`).hidden) {
      assert(performance.now() < deadline, `Navigation to ${name} timed out`);
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
  };
  doc.querySelector('[data-kind="commitments"] [aria-label="Edit Rent"]').click();
  const expense = doc.querySelector('[data-kind="commitments"] .items form');
  expense.elements.namedItem("amount").value = "1234";
  expense.requestSubmit();
  await go("spending");
  doc.querySelector('[aria-label="Edit Lunch"]').click();
  const spending = doc.querySelector("#spending-list form");
  spending.elements.namedItem("amount").value = "56.78";
  spending.requestSubmit();
  await go("houses");
  doc.querySelector('[aria-label="Edit House One"]').click();
  const house = doc.querySelector("#house-list form");
  house.elements.namedItem("name").value = "Updated house";
  house.requestSubmit();
  await go("renovation");
  const card = doc.querySelector("#renovation-list details");
  [...card.querySelectorAll("button")].find((node) => node.textContent === "Edit item and payments").click();
  const item = card.querySelector("form");
  item.elements.namedItem("name").value = "Updated cabinets";
  item.requestSubmit();
  const deadline = performance.now() + 5000;
  while (doc.getElementById("save-status").textContent !== "Saved") {
    assert(performance.now() < deadline, "Account save did not complete");
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
  const response = await doc.defaultView.fetch("/api/state");
  const saved = JSON.parse((await response.json()).backup).data;
  assert(saved.commitments[0].amount === 1234, "Expense edit did not reach the saved account");
  assert(saved.spending[0].amount === 56.78, "Spending edit did not reach the saved account");
  assert(saved.houses[0].name === "Updated house", "House edit did not reach the saved account");
  assert(saved.renovationItems[0].name === "Updated cabinets", "Renovation edit did not reach the saved account");
  assert(noEntryFocus(doc), "Cross-module save reopened an input keyboard");
});

await test("Expense Add completes without focusing another entry field", async () => {
  const doc = await expensesFrame();
  const section = doc.querySelector('[data-kind="commitments"]');
  const form = section.querySelector('[data-role="add"] form');
  section.querySelector('[data-role="add"]').open = true;
  form.elements.namedItem("name").value = "New commitment";
  form.elements.namedItem("amount").value = "45";
  form.requestSubmit();
  assert(section.querySelector(".items").textContent.includes("New commitment"), "Expense Add failed");
  assert(noEntryFocus(doc), "Expense Add reopened the input keyboard");
});

await test("Expense inline draft keeps focus and caret during an income rerender", async () => {
  const doc = await expensesFrame();
  const section = doc.querySelector('[data-kind="commitments"]');
  section.querySelector('[aria-label="Edit Rent"]').click();
  const form = section.querySelector(".items form");
  assert(form, "Expense inline form is missing");
  const name = form.elements.namedItem("name");
  name.value = "Unfinished rent";
  name.focus();
  name.setSelectionRange(4, 4);
  const income = doc.getElementById("income");
  income.value = "8000";
  income.dispatchEvent(new Event("input", { bubbles: true }));
  assert(section.querySelector(".items form") === form && doc.activeElement === name && name.selectionStart === 4, "Expense rerender disrupted inline typing");
});

await test("Scenario conversion remains reflected while an Expense editor is open", async () => {
  const doc = await expensesFrame({ stress: true });
  const section = doc.querySelector('[data-kind="commitments"]');
  const row = section.querySelector(".items li");
  row.querySelector('[aria-label^="Edit "]').click();
  const form = row.querySelector("form");
  assert(form, "Expense inline form is missing");
  row.querySelector('[aria-label^="Make "]').click();
  assert(!row.classList.contains("scenario") && !row.querySelector('[role="switch"]'), "Scenario conversion left stale row controls");
  assert(row.querySelector("form") === form && !form.elements.namedItem("scenario").checked, "Scenario conversion disrupted its inline form");
});

await test("updating an Expense closes the editor and returns focus to its Edit button", async () => {
  const doc = await expensesFrame();
  const section = doc.querySelector('[data-kind="commitments"]');
  const add = section.querySelector('[data-role="add"] form');
  add.elements.namedItem("name").value = "Add draft";
  section.querySelector('[aria-label="Edit Rent"]').click();
  const form = section.querySelector(".items form");
  assert(form, "Expense editor is not inside its row");
  form.elements.namedItem("amount").value = "1200";
  form.requestSubmit();
  const edit = section.querySelector('[aria-label="Edit Rent"]');
  assert(section.querySelector(".cost").textContent.includes("1,200"), "Expense amount was not updated");
  assert(!section.querySelector("details.add").open, "Expense edit no longer closes on save");
  assert(doc.activeElement === edit, "Expense update lost keyboard focus");
  assert(add.elements.namedItem("name").value === "Add draft", "Expense update overwrote the Add draft");
});

await test("cancelling an Expense edit returns focus without changing the Expense", async () => {
  const doc = await expensesFrame();
  const section = doc.querySelector('[data-kind="commitments"]');
  const edit = section.querySelector('[aria-label="Edit Rent"]');
  edit.click();
  const form = section.querySelector(".items form");
  assert(form, "Expense editor is not inside its row");
  form.querySelector('[data-action="cancel"]').click();
  assert(section.querySelector(".cost").textContent.includes("1,000"), "Cancel changed the Expense");
  assert(doc.activeElement === edit, "Expense cancel left focus in a hidden form");
});

await test("long Expense details do not spill into Scenario action buttons on narrow screens", async () => {
  const doc = await expensesFrame({ stress: true });
  doc.body.style.fontSize = "24px";
  const detail = doc.querySelector('[data-kind="commitments"] .items .detail');
  assert(detail.scrollWidth <= detail.clientWidth + 1, "Expense detail spills outside its grid cell into actions");
  assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, "Expense row overflows the page");
});

window.runLayoutChecks = ({ textSize = 16 } = {}) => {
  reset();
  document.body.style.fontSize = `${textSize}px`;
  state.lifestyle[0].name = "Long category ".repeat(5).trim();
  state.houses[0].name = "Long house ".repeat(7).trim();
  state.houses[0].startMonth = "2099-01";
  state.houses[0].loan = 1000000000;
  state.houses[0].termMonths = 1;
  state.renovationItems[0].notes = "N".repeat(500);
  spending.render();
  houses.render();
  renovation.render();
  home.render();
  const errors = [];
  for (const name of ["home", "expenses", "spending", "houses", "renovation"]) {
    showPage(name);
    const root = byId(`page-${name}`);
    root.querySelectorAll("details").forEach((panel) => { panel.open = true; });
    if (name === "spending") click('#spending-list [aria-label="Edit Lunch"]');
    if (name === "houses") {
      byId("house-list").querySelector('[aria-label^="Edit "]').click();
    }
    if (name === "renovation") {
      const category = byId("renovation-categories").querySelector("details");
      [...category.querySelectorAll("button")].find((node) => node.textContent === "Rename category").click();
      const card = byId("renovation-list").querySelector("details");
      [...card.querySelectorAll("button")].find((node) => node.textContent === "Edit item and payments").click();
      const row = card.querySelector(".renovation-payments li");
      [...row.querySelectorAll("button")].find((node) => node.textContent === "Edit payment").click();
    }
    const visible = (node) => node.getClientRects().length > 0;
    if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 1) {
      errors.push(`${name}: horizontal document overflow`);
    }
    for (const control of [...root.querySelectorAll("input,select,textarea")].filter(visible)) {
      const rect = control.getBoundingClientRect();
      const parent = control.parentElement.getBoundingClientRect();
      if (rect.left < parent.left - 1 || rect.right > parent.right + 1) {
        errors.push(`${name}: ${control.name || control.id} exceeds its field`);
      }
    }
    for (const pair of [...root.querySelectorAll(".pair")].filter(visible)) {
      const controls = [...pair.querySelectorAll("input,select")].filter(visible);
      if (controls.length !== 2) continue;
      const [first, second] = controls.map((control) => control.getBoundingClientRect());
      if (Math.abs(first.x - second.x) > 1) {
        if (first.width < 190 || second.width < 190) errors.push(`${name}: paired controls are too cramped`);
        if (Math.abs(first.bottom - second.bottom) > 1) errors.push(`${name}: paired controls are misaligned`);
      }
      if (first.right > second.left && first.left < second.right &&
        first.bottom > second.top && first.top < second.bottom) errors.push(`${name}: paired controls overlap`);
    }
  }
  return { width: innerWidth, textSize, errors };
};
const layout = window.runLayoutChecks();
results.push({
  name: `All-page control alignment and overflow at ${layout.width}px`,
  passed: layout.errors.length === 0,
  ...(layout.errors.length ? { error: layout.errors.join("; ") } : {}),
});
window.uiTestResults = results;
document.title = `UI tests: ${results.filter((result) => result.passed).length}/${results.length} passed`;
const report = document.createElement("pre");
report.style.whiteSpace = "pre-wrap";
report.textContent = results.map((result) =>
  `${result.passed ? "PASS" : "FAIL"} ${result.name}${result.error ? `: ${result.error}` : ""}`,
).join("\n");
document.body.replaceChildren(report);
</script>
