<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI regression tests</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<script type="module">
import { setupSpending } from "../../spending-ui.js";
import { setupRenovation } from "../../renovation-ui.js";
import { setupHouses } from "../../houses.js";
import { setupHome } from "../../home.js";
import { currentDate, currentMonth } from "../../format.js";
import { renovationDate, renovationMonth } from "../../renovation-calendar.js";
import { fixture } from "../helpers/renovation-fixture.js";

const source = new DOMParser().parseFromString(await (await fetch("/index.html")).text(), "text/html");
source.querySelectorAll("script").forEach((script) => script.remove());
const markup = source.body.innerHTML;
const results = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); };
let state;
let spending;
let renovation;
let houses;
let home;
let nextId = 0;
const byId = (id) => document.getElementById(id);
const field = (name) => byId("spending-form").elements.namedItem(name);
const click = (selector) => document.querySelector(selector).click();
const inlineSpending = () => byId("spending-list").querySelector("form");
const noEntryFocus = (doc = document) =>
  !doc.activeElement.matches("input,select,textarea");

function showPage(name) {
  for (const page of ["home", "expenses", "spending", "houses", "renovation"]) {
    byId(`page-${page}`).hidden = page !== name;
  }
}

function reset(name = "spending") {
  document.body.innerHTML = markup;
  document.body.style.fontSize = "";
  byId("signed-in-shell").hidden = false;
  byId("startup-panel").hidden = true;
  showPage(name);
  state = fixture();
  state.lifestyle = [
    { id: "food", name: "Food", low: 400, high: 800, everyMonths: 1 },
    { id: "fuel", name: "Fuel", low: 200, high: 400, everyMonths: 1 },
  ];
  state.spending = [{
    id: "lunch", date: currentDate(), categoryId: "food", amount: 12.34, description: "Lunch",
  }];
  const commit = (next) => {
    state = next;
    spending.render();
    renovation.render();
    houses.render();
    home.render();
  };
  const options = { getState: () => state, commit, newId: () => `ui-${++nextId}` };
  spending = setupSpending(options);
  renovation = setupRenovation(options);
  houses = setupHouses({ ...options, notify: (message) => { throw new Error(message); } });
  home = setupHome(options);
  spending.render();
  renovation.render();
  houses.render();
  home.render();
}

async function test(name, operation) {
  try {
    reset();
    await operation();
    results.push({ name, passed: true });
  } catch (error) {
    results.push({ name, passed: false, error: error.message });
  }
}

await test("Spending date and month fields use app sizing instead of native themed boxes", () => {
  for (const control of [field("date"), byId("spending-month")]) {
    const style = getComputedStyle(control);
    assert(style.appearance === "none", `${control.type} retains browser-native themed sizing`);
    assert(style.display === "block", `${control.type} retains inline baseline spacing`);
    const rect = control.getBoundingClientRect();
    const amount = field("amount").getBoundingClientRect();
    assert(Math.abs(rect.height - amount.height) <= 1, `${control.type} height differs from Amount`);
    const container = control.parentElement.getBoundingClientRect();
    assert(Math.abs(rect.width - container.width) <= 1, `${control.type} does not fit its field`);
  }
});

await test("Spending retains the selected date when saving an entry", () => {
  field("date").value = "2024-02-29";
  field("amount").value = "23.45";
  field("description").value = "Leap day";
  byId("spending-form").requestSubmit();
  assert(state.spending.length === 2, "Date styling prevented submitting the entry");
  assert(state.spending[1].date === "2024-02-29", "Selected date changed during submission");
});

await test("adding Spending preserves accounting without reopening an input keyboard", () => {
  field("categoryId").value = "fuel";
  field("amount").value = "23.45";
  field("description").value = "Fuel stop";
  byId("spending-form").requestSubmit();
  assert(state.spending.length === 2 && state.spending[1].amount === 23.45, "Entry was not added correctly");
  assert(state.spending[1].categoryId === "fuel", "Selected category changed");
  assert(field("categoryId").value === "fuel" && field("amount").value === "", "Next-entry defaults changed");
  assert(noEntryFocus(), "Add reopens an input keyboard");
});

await test("editing Spending opens at the row and preserves the Add draft", () => {
  field("description").value = "New entry draft";
  field("amount").value = "98";
  click('#spending-list [aria-label="Edit Lunch"]');
  assert(inlineSpending(), "Edit did not open inside the Spending row");
  assert(inlineSpending().elements.namedItem("amount").value === "12.34", "Edit did not load the entry");
  assert(field("description").value === "New entry draft" && field("amount").value === "98", "Edit overwrote the Add draft");
  assert(noEntryFocus(), "Edit automatically opened an input keyboard");
});

await test("updating Spending saves locally without jumping to Add", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  assert(inlineSpending(), "Inline Spending editor is missing");
  inlineSpending().elements.namedItem("amount").value = "34.56";
  inlineSpending().requestSubmit();
  assert(state.spending.length === 1 && state.spending[0].amount === 34.56, "Update changed accounting behavior");
  assert(!inlineSpending() && noEntryFocus(), "Update left an input focused");
  assert(byId("spending-list").textContent.includes("Entry updated"), "Update feedback is not local to the list");
});

await test("cancelling Spending leaves saved data and the Add draft unchanged", () => {
  field("description").value = "Add draft";
  click('#spending-list [aria-label="Edit Lunch"]');
  assert(inlineSpending(), "Inline Spending editor is missing");
  inlineSpending().elements.namedItem("amount").value = "99";
  const confirm = window.confirm;
  window.confirm = () => true;
  try { inlineSpending().querySelector('[data-action="cancel"]').click(); }
  finally { window.confirm = confirm; }
  assert(state.spending[0].amount === 12.34, "Cancel changed saved data");
  assert(field("description").value === "Add draft", "Cancel changed the Add draft");
  assert(noEntryFocus(), "Cancel reopened an input keyboard");
});

await test("deleting Spending leaves the next-entry form usable without calendar activation", () => {
  const confirm = window.confirm;
  window.confirm = () => true;
  try { click('#spending-list [aria-label="Delete Lunch"]'); }
  finally { window.confirm = confirm; }
  assert(state.spending.length === 0, "Delete did not remove the entry");
  assert(noEntryFocus(), "Delete reopened an input keyboard");
});

await test("Spending inline draft survives rerender and rejected discard", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  assert(form, "Inline Spending editor is missing");
  const description = form.elements.namedItem("description");
  description.value = "Unfinished edit";
  description.focus();
  description.setSelectionRange(4, 4);
  spending.render();
  assert(inlineSpending() === form && document.activeElement === description && description.selectionStart === 4, "Rerender disrupted the inline editor");
  const confirm = window.confirm;
  window.confirm = () => false;
  try { form.querySelector('[data-action="cancel"]').click(); }
  finally { window.confirm = confirm; }
  assert(inlineSpending() === form && description.value === "Unfinished edit", "Rejected discard lost the draft");
});
await test("Spending rerender preserves options, selection, draft text, focus and caret", () => {
  field("categoryId").value = "fuel";
  const option = field("categoryId").options[0];
  const filterOption = byId("spending-category-filter").options[0];
  field("amount").value = "12.34";
  field("description").value = "Unfinished description";
  field("description").focus();
  field("description").setSelectionRange(5, 5);
  spending.render();
  assert(field("categoryId").options[0] === option, "Unchanged entry dropdown was rebuilt");
  assert(byId("spending-category-filter").options[0] === filterOption, "Unchanged filter dropdown was rebuilt");
  assert(field("categoryId").value === "fuel" && field("amount").value === "12.34", "Draft values changed");
  assert(document.activeElement === field("description") && field("description").selectionStart === 5, "Draft focus/caret moved");
});

await test("Spending save stays at the current scroll position", () => {
  const spacer = document.createElement("div");
  spacer.style.height = "1800px";
  byId("spending-form").before(spacer);
  window.scrollTo(0, 1100);
  const before = window.scrollY;
  assert(before > 0, "Scroll fixture did not scroll");
  field("amount").value = "45.67";
  field("description").value = "No jump";
  byId("spending-form").requestSubmit();
  assert(Math.abs(window.scrollY - before) <= 1, "Add scrolled away from the completed action");
});

await test("invalid inline Spending remains editable without changing saved data", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  form.elements.namedItem("description").value = "   ";
  form.requestSubmit();
  assert(inlineSpending() === form && state.spending[0].description === "Lunch", "Invalid inline entry changed saved data or closed");
  assert(!form.elements.namedItem("description").validity.valid, "Invalid description was not identified locally");
});

await test("Spending edit outside filters reports success locally without focusing Add", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  form.elements.namedItem("date").value = "2024-02-29";
  form.requestSubmit();
  assert(state.spending[0].date === "2024-02-29", "Date update was not saved");
  assert(byId("spending-list").textContent.includes("outside these filters"), "Filtered-out save lacks local confirmation");
  assert(noEntryFocus(), "Filtered-out update focused the Add form");
});

await test("Spending rejects a filter change that would discard a dirty inline editor", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  form.elements.namedItem("amount").value = "77";
  const month = byId("spending-month");
  const previous = month.value;
  const confirm = window.confirm;
  window.confirm = () => false;
  try {
    month.value = "2024-02";
    month.dispatchEvent(new Event("change"));
  } finally { window.confirm = confirm; }
  assert(month.value === previous && inlineSpending() === form, "Rejected filter change lost the inline draft");
});

await test("Spending switching editors respects discard confirmation", () => {
  state.spending.push({ id: "second", date: currentDate(), categoryId: "food", amount: 5, description: "Second" });
  spending.render();
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  form.elements.namedItem("amount").value = "77";
  const confirm = window.confirm;
  window.confirm = () => false;
  try { click('#spending-list [aria-label="Edit Second"]'); }
  finally { window.confirm = confirm; }
  assert(inlineSpending() === form && form.elements.namedItem("amount").value === "77", "Switch discarded the draft without permission");
});

await test("category renames update Spending choices without changing a valid selection", () => {
  field("categoryId").value = "fuel";
  state.lifestyle[1].name = "Updated fuel";
  spending.render();
  assert(field("categoryId").value === "fuel", "Rename lost category selection");

});

await test("category rename updates the displayed category around a retained Spending editor", () => {
  click('#spending-list [aria-label="Edit Lunch"]');
  const form = inlineSpending();
  state.lifestyle[0].name = "Updated food";
  spending.render();
  assert(byId("spending-list").querySelector(".detail").textContent.includes("Updated food"), "Retained row shows an outdated category name");

const renovationCard = (id = "cabinets") => byId("renovation-list").querySelector(`li[data-id="${id}"]`);
const withConfirm = (answer, operation) => {
  const original = window.confirm;
  window.confirm = () => answer;
  try { operation(); } finally { window.confirm = original; }
};

await test("Renovation overview shows Budget, Actual cost, Paid and Outstanding, and Due only above zero", () => {
  showPage("renovation");
  const keys = () => [...byId("renovation-overview").querySelectorAll(".stat")].map((tile) => tile.dataset.key).join();
  state.renovationItems[0].installmentPlan.startMonth = "2099-01";
  renovation.render();
  assert(keys() === "budget,actualCost,paid,outstanding", `Unexpected tiles ${keys()}`);
  state.renovationItems[0].installmentPlan.startMonth = renovationMonth();
  renovation.render();
  assert(keys() === "budget,actualCost,paid,outstanding,due", `Due tile missing: ${keys()}`);
});

await test("Renovation Add item needs only name, notes, budget and actual cost", () => {
  showPage("renovation");
  const add = byId("renovation-add");
  const form = byId("renovation-item-form");
  add.open = true;
  assert(!form.querySelector('[name="categoryId"]') && !byId("renovation-categories"), "Categories are still shown");
  assert([...form.elements].filter((node) => node.name).map((node) => node.name).join() === "name,notes,budget,actualCost", "Add form has extra fields");
  form.elements.namedItem("name").value = "Lighting";
  form.elements.namedItem("notes").value = "Living room";
  form.elements.namedItem("budget").value = "800";
  form.requestSubmit();
  const saved = state.renovationItems.find((item) => item.name === "Lighting");
  assert(saved && saved.houseId === "h1" && saved.budget === 800 && saved.notes === "Living room" && saved.actualCost === undefined, "Item was not saved as entered");
  assert(renovationCard(saved.id), "New item card is missing");
  assert(form.elements.namedItem("name").value === "" && add.open, "Add form did not reset in place");
  assert(noEntryFocus(), "Add reopened an input keyboard");
});

await test("Renovation item edits inline in its card, keeps its plan and the Add draft", () => {
  showPage("renovation");
  const add = byId("renovation-item-form");
  add.elements.namedItem("name").value = "Add draft";
  renovationCard().querySelector('[aria-label="Edit Cabinets"]').click();
  const form = renovationCard().querySelector("form");
  assert(form && form !== add, "Item editor did not open inside its card");
  assert(form.elements.namedItem("actualCost").value === "12000", "Item editor did not load the item");
  assert(noEntryFocus(), "Opening the item editor forced the keyboard open");
  form.elements.namedItem("name").value = "Kitchen cabinets";
  form.requestSubmit();
  assert(state.renovationItems[0].name === "Kitchen cabinets" && state.renovationItems[0].installmentPlan.count === 10, "Item save lost data");
  assert(!renovationCard().querySelector("form"), "Item editor stayed open");
  assert(document.activeElement === renovationCard().querySelector('[aria-label="Edit Kitchen cabinets"]'), "Focus did not return to Edit");
  assert(add.elements.namedItem("name").value === "Add draft", "Item edit overwrote the Add draft");
});

await test("Renovation rerender keeps the inline editor draft, focus and caret", () => {

  const house = byId("renovation-house").options[0];

await test("Renovation payment saves immediately and fills the oldest installment", () => {
  showPage("renovation");
  state.renovationItems[0].installmentPlan.startMonth = renovationMonth();
  renovation.render();
  renovationCard().querySelector('[aria-label="Add payment to Cabinets"]').click();
  const form = renovationCard().querySelector("form");
  assert(form && form.elements.namedItem("kind").value === "payment" && form.elements.namedItem("date").value === renovationDate(), "Payment form defaults are wrong");
  assert(noEntryFocus(), "Opening the payment form forced the keyboard open");
  form.elements.namedItem("amount").value = "1500";
  form.requestSubmit();
  assert(state.renovationPayments.length === 2 && state.renovationPayments[1].amount === 1500 && state.renovationPayments[1].kind === "payment", "Payment was not saved");
  assert(renovationCard().querySelector('[data-role="plan"]').textContent.includes("1 of 10 covered"), "Payment did not cover the oldest installment");
  assert(document.activeElement === renovationCard().querySelector('[aria-label="Add payment to Cabinets"]'), "Focus did not return to Add payment");
});

await test("Renovation payment edit and delete happen in the payment row", () => {
  showPage("renovation");
  const row = () => renovationCard().querySelector('.payments li[data-id="deposit"]');
  row().querySelector('[aria-label="Edit payment"]').click();
  const form = row().querySelector("form");
  assert(form && form.elements.namedItem("amount").value === "2000" && form.elements.namedItem("kind").value === "deposit", "Payment editor did not open in its row");
  form.elements.namedItem("amount").value = "1500";
  form.requestSubmit();
  assert(state.renovationPayments[0].amount === 1500, "Payment edit was not saved");
  assert(document.activeElement === row().querySelector('[aria-label="Edit payment"]'), "Focus did not return to the payment row");
  withConfirm(false, () => row().querySelector('[aria-label="Delete payment"]').click());
  assert(state.renovationPayments.length === 1, "Declined delete removed the payment");
  withConfirm(true, () => row().querySelector('[aria-label="Delete payment"]').click());
  assert(state.renovationPayments.length === 0 && !row(), "Payment was not deleted");
});

await test("Renovation monthly plan is set, changed and removed from the item", () => {
  showPage("renovation");
  renovationCard().querySelector('[aria-label="Monthly plan for Cabinets"]').click();
  let form = renovationCard().querySelector("form");
  assert(form.elements.namedItem("amount").value === "1000" && form.elements.namedItem("count").value === "10", "Plan form did not load the plan");
  form.elements.namedItem("count").value = "8";
  form.requestSubmit();
  assert(state.renovationItems[0].installmentPlan.count === 8, "Plan change was not saved");
  renovationCard().querySelector('[aria-label="Monthly plan for Cabinets"]').click();
  form = renovationCard().querySelector("form");
  withConfirm(true, () => form.querySelector('[aria-label="Remove plan"]').click());
  assert(state.renovationItems[0].installmentPlan === undefined, "Plan was not removed");
  assert(!renovationCard().querySelector('[data-role="plan"]:not([hidden])'), "Plan line is still shown");
});

await test("Renovation errors name the item, keep the draft and save nothing", () => {
  showPage("renovation");
  const before = JSON.stringify(state);
  renovationCard().querySelector('[aria-label="Monthly plan for Cabinets"]').click();
  const form = renovationCard().querySelector("form");
  form.elements.namedItem("amount").value = "2000";
  form.requestSubmit();
  assert(JSON.stringify(state) === before, "Invalid plan was saved");
  assert(form.isConnected && form.elements.namedItem("amount").value === "2000", "Invalid plan closed the editor");
  assert(form.querySelector('[data-role="message"]').textContent.startsWith("Cabinets: Deposits plus"), "Error does not name the item");
});

await test("Renovation payment and plan buttons wait for an actual cost", () => {
  showPage("renovation");
  state.renovationItems.push({ id: "paint", houseId: "h1", name: "Painting", budget: 300 });
  renovation.render();

    const action = renovationCard("paint").querySelector(`[aria-label="${label}"]`);
    assert(action.disabled && action.title === "Set actual cost first", `${label} is not waiting for an actual cost`);
  }
  assert(!renovationCard().querySelector('[aria-label="Add payment to Cabinets"]').disabled, "Cabinets payments are disabled");

await test("Renovation opening another editor asks before discarding changes", () => {
  showPage("renovation");
  renovationCard().querySelector('[aria-label="Edit Cabinets"]').click();
  const form = renovationCard().querySelector("form");
  form.elements.namedItem("name").value = "Changed";
  withConfirm(false, () => renovationCard().querySelector('[aria-label="Add payment to Cabinets"]').click());
  assert(form.isConnected && renovationCard().querySelectorAll("form").length === 1, "Declined discard closed the item editor");
  withConfirm(true, () => renovationCard().querySelector('[aria-label="Add payment to Cabinets"]').click());
  assert(!form.isConnected && renovationCard().querySelector("form [name=kind]"), "Payment editor did not replace the item editor");
  assert(state.renovationItems[0].name === "Cabinets", "Discarded edit was saved");
});

await test("Renovation delete removes the item and its payments after confirmation", () => {
  showPage("renovation");
  withConfirm(false, () => renovationCard().querySelector('[aria-label="Delete Cabinets"]').click());
  assert(state.renovationItems.length === 1, "Declined delete removed the item");
  withConfirm(true, () => renovationCard().querySelector('[aria-label="Delete Cabinets"]').click());
  assert(state.renovationItems.length === 0 && state.renovationPayments.length === 0, "Delete left data behind");
  assert(!renovationCard() && !byId("renovation-empty").hidden, "Empty message is not shown");
});

  for (const action of byId("page-renovation").querySelectorAll("button")) {
    const label = action.getAttribute("aria-label");

  showPage("home");
  assert(byId("home-renovation").querySelector("summary use").getAttribute("href") === "#i-tools", "Home Renovation does not use the wrench icon");

await test("House Bank installment sits in More options, opens for saved values and for invalid input", () => {

async function expensesFrame({ stress = false, completeAccount = false } = {}) {
  const doc = source.cloneNode(true);
  doc.querySelector('meta[http-equiv="Content-Security-Policy"]').remove();
  const base = doc.createElement("base");
  base.href = `${location.origin}/`;
  doc.head.prepend(base);
  const account = fixture();
  account.commitments = [{ id: "rent", name: "Rent", amount: 1000, everyMonths: 1 }];
  if (completeAccount) {
    account.lifestyle = [{ id: "food", name: "Food", low: 400, high: 800, everyMonths: 1 }];
    account.spending = [{ id: "lunch", date: currentDate(), categoryId: "food", amount: 12.34, description: "Lunch" }];
  }
  if (stress) {
    account.commitments[0] = {
      ...account.commitments[0], name: "R".repeat(80), amount: 1000000000, scenario: { on: true },
    };
  }
  const transport = doc.createElement("script");
  transport.textContent = `
    let account = ${JSON.stringify(account)};
    window.fetch = async (path, options = {}) => {
      if (path !== "/api/state") throw new Error("Unexpected test request: " + path);
      if (options.method === "PUT") {
        account = JSON.parse(JSON.parse(options.body).backup).data;
        return Response.json({ ok: true });
      }
      return Response.json({ backup: JSON.stringify({ schemaVersion: 9, data: account }) });
    };
    location.hash = "#/expenses";
  `;
  doc.head.append(transport);
  const app = doc.createElement("script");
  app.type = "module";
  app.src = "/app.js";
  doc.body.append(app);
  const frame = document.createElement("iframe");
  frame.title = "Synthetic Expenses UI test";
  frame.style.cssText = "width:100%;height:900px;border:0";
  if (stress) frame.style.width = "320px";
  frame.srcdoc = doc.documentElement.outerHTML;
  document.body.replaceChildren(frame);
  const deadline = performance.now() + 5000;
  while (!frame.contentDocument?.querySelector('#signed-in-shell:not([hidden])')) {
    assert(performance.now() < deadline, "Synthetic Expenses app did not initialize");
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
  return frame.contentDocument;
}

await test("real-app inline edits across all modules reach the saved account snapshot", async () => {
  const doc = await expensesFrame({ completeAccount: true });
  const go = async (name) => {
    doc.defaultView.location.hash = `#/${name}`;
    const deadline = performance.now() + 5000;
    while (doc.getElementById(`page-${name}`).hidden) {
      assert(performance.now() < deadline, `Navigation to ${name} timed out`);
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
  };
  doc.querySelector('[data-kind="commitments"] [aria-label="Edit Rent"]').click();
  const expense = doc.querySelector('[data-kind="commitments"] .items form');
  expense.elements.namedItem("amount").value = "1234";
  expense.requestSubmit();
  await go("spending");
  doc.querySelector('[aria-label="Edit Lunch"]').click();
  const spending = doc.querySelector("#spending-list form");
  spending.elements.namedItem("amount").value = "56.78";
  spending.requestSubmit();
  await go("houses");
  doc.querySelector('[aria-label="Edit House One"]').click();
  const house = doc.querySelector("#house-list form");
  house.elements.namedItem("name").value = "Updated house";
  house.requestSubmit();
  await go("renovation");
  doc.querySelector('#renovation-list [aria-label="Edit Cabinets"]').click();
  const item = doc.querySelector("#renovation-list form");
  item.elements.namedItem("name").value = "Updated cabinets";
  item.requestSubmit();
  const deadline = performance.now() + 5000;
  while (doc.getElementById("save-status").textContent !== "Saved") {
    assert(performance.now() < deadline, "Account save did not complete");
    await new Promise((resolve) => setTimeout(resolve, 10));
  }
  const response = await doc.defaultView.fetch("/api/state");
  const saved = JSON.parse((await response.json()).backup).data;
  assert(saved.commitments[0].amount === 1234, "Expense edit did not reach the saved account");
  assert(saved.spending[0].amount === 56.78, "Spending edit did not reach the saved account");
  assert(saved.houses[0].name === "Updated house", "House edit did not reach the saved account");
  assert(saved.renovationItems[0].name === "Updated cabinets", "Renovation edit did not reach the saved account");
  assert(noEntryFocus(doc), "Cross-module save reopened an input keyboard");
});

window.runLayoutChecks = ({ textSize = 16 } = {}) => {
  reset();
  document.body.style.fontSize = `${textSize}px`;
  state.lifestyle[0].name = "Long category ".repeat(5).trim();
  state.houses[0].name = "Long house ".repeat(7).trim();
  state.houses[0].startMonth = "2099-01";
  state.houses[0].loan = 1000000000;
  state.houses[0].termMonths = 1;
  state.renovationItems[0].notes = "N".repeat(500);
  spending.render();
  houses.render();
  renovation.render();
  home.render();
  const errors = [];
  for (const name of ["home", "expenses", "spending", "houses", "renovation"]) {
    showPage(name);
    const root = byId(`page-${name}`);
    root.querySelectorAll("details").forEach((panel) => { panel.open = true; });
    if (name === "spending") click('#spending-list [aria-label="Edit Lunch"]');
    if (name === "houses") {
      byId("house-list").querySelector('[aria-label^="Edit "]').click();
    }
    if (name === "renovation") {
      byId("renovation-list").querySelector('[aria-label^="Edit "]').click();
    }
    const visible = (node) => node.getClientRects().length > 0;
    if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 1) {
      errors.push(`${name}: horizontal document overflow`);
    }
    for (const control of [...root.querySelectorAll("input,select,textarea")].filter(visible)) {
      const rect = control.getBoundingClientRect();
      const parent = control.parentElement.getBoundingClientRect();
      if (rect.left < parent.left - 1 || rect.right > parent.right + 1) {
        errors.push(`${name}: ${control.name || control.id} exceeds its field`);
      }
    }
    for (const pair of [...root.querySelectorAll(".pair")].filter(visible)) {
      const controls = [...pair.querySelectorAll("input,select")].filter(visible);
      if (controls.length !== 2) continue;
      const [first, second] = controls.map((control) => control.getBoundingClientRect());
      if (Math.abs(first.x - second.x) > 1) {
        if (first.width < 190 || second.width < 190) errors.push(`${name}: paired controls are too cramped`);
        if (Math.abs(first.bottom - second.bottom) > 1) errors.push(`${name}: paired controls are misaligned`);
      }
      if (first.right > second.left && first.left < second.right &&
        first.bottom > second.top && first.top < second.bottom) errors.push(`${name}: paired controls overlap`);
    }
  }
  return { width: innerWidth, textSize, errors };
};
const layout = window.runLayoutChecks();
results.push({
  name: `All-page control alignment and overflow at ${layout.width}px`,
  passed: layout.errors.length === 0,
  ...(layout.errors.length ? { error: layout.errors.join("; ") } : {}),
});
window.uiTestResults = results;
document.title = `UI tests: ${results.filter((result) => result.passed).length}/${results.length} passed`;
const report = document.createElement("pre");
report.style.whiteSpace = "pre-wrap";
report.textContent = results.map((result) =>
  `${result.passed ? "PASS" : "FAIL"} ${result.name}${result.error ? `: ${result.error}` : ""}`,
).join("\n");
document.body.replaceChildren(report);
</script>
